{% load crispy_forms_filters %}


<head>
  <!-- Підключаємо Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KyZXEJZJ5b1K7iFY3t7AcgXwDr7m7fD61F6Ut7uF7gV6tXrlPBEXJ5V5KUG6kwj8" crossorigin="anonymous">

  <!-- Підключаємо crispy-forms для підтримки Bootstrap стилів -->
  <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.1.3/dist/cerulean/bootstrap.min.css" rel="stylesheet">
</head>


{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <h1>Авторизація</h1>

      <!-- Форма авторизації -->
      <form method="POST">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary w-100">Увійти</button>
      </form>
    </div>
  </div>
</div>

<!-- Підключаємо Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-v6bGgZL3pBTQyfiHRuZP9ZjQnF4wtdZ+4iwj7lA+2EYj1N1SrpDq5xCrluGfw5HY" crossorigin="anonymous"></script>
{% endblock %}
