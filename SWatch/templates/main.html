{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Видео</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .video-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease-in-out;
        }
        .video-card:hover {
            transform: scale(1.05);
        }
        .video-thumbnail {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }
        .channel-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin-right: 10px;
        }
        .video-info {
            padding: 10px;
        }
        .video-title {
            font-size: 16px;
            font-weight: bold;
            margin: 0;
        }
        .video-channel {
            font-size: 14px;
            color: gray;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">Видео</h1>
        <div class="row">
            {% for video in videos %}
            <div class="col-md-4 mb-4">
                <div class="card video-card">
                    <a href="{% url 'video-detail' video.pk %}">
                        <img src="{{ video.photo.url }}" class="video-thumbnail" alt="Видео">
                    </a>
                    <div class="d-flex align-items-center video-info">
                        {% if video.channel.avatar %}
                            <img src="{{ video.channel.avatar.url }}" class="channel-avatar" alt="Аватар">
                        {% endif %}
                        <div>
                            <p class="video-title">{{ video.title }}</p>
                            <p class="video-channel">{{ video.channel.title }}</p>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
